<!DOCTYPE html>
<html>
    <head>
        <title>
            Solomon Prayer - Portfolio
        </title>
        <link rel="stylesheet" href="style.css">
        <style>
            body {
                background: #f0f2f5;
                font-family: Arial;
                padding: 40px;
            }
            .container {
                max-width: 600px;
                margin: auto;
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                text-align: center;
            }
            a {
                display: block;
                margin: 15px 0;
                padding: 12px;
                background: #24292f;
                color: white;
                text-decoration: none;
                border-radius: 8px;
            }
            a:hover {
                background: #000;
            }
            .dark-mode { background: #0d1117 !important; }
            .dark-mode .container { background: #161b22 !important; color: white !important; }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="prayer.png" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
            object-position: top center; display: block; margin: 0 auto;">
            <h1>Solomon Prayer</h1>
            <p>Fullstack Journey - 90 Days</p>
            <p>My projects:</p>
            <a href="day-3/index.html">Day 5 - Profile Card</a>
            <a href="day-2/index.html">Day 2 - My First Page</a>
            <p style="margin-top: 20px; font-size: 14px; color: #666;">
                Live on Github Pages
            </p>

            <button onclick="showContact()" style="margin-top: 15px; 
            padding: 10px 20px; cursor: pointer; border-radius: 8px; 
            border: none; background: #24292f; color: white; 
            width: 100%;">Show Contact</button>

            <div id="contact" style="display: none; text-align: left; margin-top: 15px; ">
                <input id="visitorName" type="text" placeholder="Your Name" style="width: 100%; 
                padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccc; 
                box-sizing: border-box; ">

                <input id="visitorEmail" type="email" placeholder="Your Email" style="width: 100%; 
                padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccc; 
                box-sizing: border-box; ">

                <textarea id="visitorMessage" placeholder="Your Message" rows="3" 
                style="width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #ccc; 
                box-sizing: border-box; "></textarea>

                <button onclick="sendMessage()" style="width: 100%; padding: 12px; background: #24292f; 
                color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; ">
                Send Message </button>
                <p id="formStatus" style="font-size: 13px; margin-top: 8px; text-align: center; "></p>

            </div>

            <div id="messageList" style="margin-top: 20px; text-align: left;">
                <h3 style="font-size: 16px; margin-bottom: 10px;">Saved Messages (local):</h3>
                <div id="savedMessages" style="font-size: 13px; color: #555;"></div>
            </div>

            <button onclick="toggleTheme()" style="margin-top: 10px; 
            padding: 10px 20px; cursor:pointer; border-radius: 8px; 
            border: 1px solid #24292f; background: white; width: 100%;">
            Toggle Dark Mode
            </button>

        </div>

        <script src="script.js"></script>
    </body>
</html>
